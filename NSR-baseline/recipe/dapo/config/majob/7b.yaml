# @package _global_

# Training settings from recipe/nsr/DAPO_baseline_7b.sh (4096-token context).
defaults:
  - common
  - _self_

majob:
  model_id: Qwen/Qwen2.5-Math-7B
  model_hidden_size: 3584
  experiment_prefix: 7b

data:
  max_prompt_length: 2048
  max_response_length: 2048
  gen_batch_size: 1536
  train_batch_size: 512

actor_rollout_ref:
  model:
    path: ${oc.env:MODEL_PATH,${oc.env:RAY_DATA_HOME}/models/Qwen2.5-Math-7B}
  actor:
    ppo_mini_batch_size: 32
    ppo_max_token_len_per_gpu: 10240
    ulysses_sequence_parallel_size: 2
  rollout:
    n: 16
    gpu_memory_utilization: 0.6
    max_num_batched_tokens: 10240

reward_model:
  overlong_buffer:
    len: 1024
